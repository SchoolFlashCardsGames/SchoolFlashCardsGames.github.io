<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SchoolFlashCards5 - Flashcards</title>
<link rel="shortcut icon" href="logo.png"/>
<script>try{var t=localStorage.getItem('sfc-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
:root{--primary:#4ECDC4;--secondary:#4ECDC4;--accent:#FFE66D;--dark:#292F36;--light:#F7FFF7;--button:#FF6B6B}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Comic Sans MS",cursive,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--light);color:var(--dark)}
.container{width:90%;max-width:1000px;margin:0 auto}
header{background:var(--primary);padding:15px 0;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.header-content{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:bold;color:#fff;text-decoration:none}
.logo span{color:var(--accent)}
.hbtns{display:flex;gap:10px;align-items:center}
.nb{background:var(--dark);color:var(--accent);border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px;text-decoration:none;transition:all .3s}
.nb:hover{background:#454545;color:#fff;transform:scale(1.05)}
.hero{background:var(--secondary);padding:30px 0;text-align:center;color:#fff}
.hero h1{font-size:38px;margin-bottom:10px}
.hero p{font-size:18px;max-width:700px;margin:0 auto}
main{padding:30px 0 50px}
.section-title{text-align:center;margin:10px 0 20px;font-size:30px}
.card{background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1);padding:20px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.set{transition:transform .3s,box-shadow .3s;cursor:pointer;border-top:8px solid var(--secondary);margin:0}
.set:hover{transform:translateY(-5px);box-shadow:0 5px 15px rgba(0,0,0,.2)}
.set h3{font-size:18px;margin-bottom:6px;overflow-wrap:anywhere}
.muted{font-size:14px;color:#666}
.btn{display:inline-block;background:var(--button);color:#fff;padding:8px 15px;border-radius:5px;border:none;font-weight:bold;cursor:pointer;font-size:15px;transition:background-color .3s;margin:3px}
.btn:hover{background:#454545}
.btn.alt{background:var(--secondary)}.btn.alt:hover{background:#3aa89f}
.btn.dk{background:var(--dark);color:var(--accent)}
.cat{background:#fff;border:2px solid var(--secondary);padding:8px 15px;border-radius:20px;cursor:pointer;font-weight:bold;margin:3px;color:var(--dark)}
.cat:hover,.cat.on{background:var(--secondary);color:#fff}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--secondary);font-size:16px;background:#fff;color:var(--dark)}
textarea{min-height:180px;resize:vertical}
label{font-weight:bold;font-size:14px;display:block;margin:10px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
.center{text-align:center}
.fc{background:#fff;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.18);min-height:280px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:28px;cursor:pointer;user-select:none;border-top:8px solid var(--secondary);overflow-wrap:anywhere;white-space:pre-wrap}
.fc.back{border-top-color:var(--button)}
.bar{height:12px;background:#ddd;border-radius:10px;overflow:hidden;margin:12px 0}
.bar div{height:100%;background:var(--button);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--secondary);border-radius:10px;padding:12px 16px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--dark)}
.opt:hover{background:var(--secondary);color:#fff}
.opt.ok{background:#2e9e4f;border-color:#2e9e4f;color:#fff}.opt.no{background:#d33;border-color:#d33;color:#fff}
.q{font-size:22px;margin-bottom:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.good{color:#2e9e4f;font-weight:bold}.bad{color:#d33;font-weight:bold}
.tile{background:#fff;border:2px solid var(--secondary);border-radius:10px;padding:10px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:15px;overflow-wrap:anywhere}
.tile.sel{background:var(--accent)}.tile.gone{visibility:hidden}.tile.wrong{background:#ffb3b3}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
table{width:100%;border-collapse:collapse}td{padding:8px;border-top:1px solid #ddd;vertical-align:top;overflow-wrap:anywhere;font-size:15px}
.star{cursor:pointer;font-size:20px;background:none;border:none}
footer{background:var(--dark);color:#fff;padding:25px 0;text-align:center;font-size:14px}
footer .c{color:#aaa}
html[data-theme=dark]{color-scheme:dark}
html[data-theme=dark] body{background:#14181d;color:#e8ecef}
html[data-theme=dark] header,html[data-theme=dark] .hero{background:#000}
html[data-theme=dark] .card,html[data-theme=dark] .fc,html[data-theme=dark] .opt,html[data-theme=dark] .tile,html[data-theme=dark] .cat{background:#1f252c;color:#e8ecef}
html[data-theme=dark] input,html[data-theme=dark] textarea,html[data-theme=dark] select{background:#3a3f47;color:#e8ecef}
html[data-theme=dark] .muted{color:#9aa4ad}
html[data-theme=dark] .nb{background:#3a3f47}
html[data-theme=dark] .tile.sel{background:#6b5d12}html[data-theme=dark] td{border-color:#2e3640}
html[data-theme=dark] .opt.ok{background:#2e9e4f}html[data-theme=dark] .opt.no{background:#d33}
</style>
</head>
<body>
<header><div class="container"><div class="header-content">
<a href="games" class="logo">School<span>Flash</span>Cards</a>
<div class="hbtns"><button class="nb" onclick="home()">My Sets</button><button class="nb" id="themeBtn" title="Dark mode">🌙</button></div>
</div></div></header>
<section class="hero"><div class="container"><h1>Flashcards</h1><p>Import your Quizlet sets and study them for free. Everything stays saved in your browser.</p></div></section>
<main><div class="container" id="app"></div></main>
<footer><div class="container"><p class="c">© 2026 SchoolFlashCards5. Not affiliated with Quizlet. <a href="https://games.schoolflashcards.com">Games</a></p></div></footer>

<script>
const $=s=>document.querySelector(s),app=$('#app'),K='sfc-sets';
let sets=load(),cur=null,mode='',deck=[],i=0,flipped=false,defFirst=false,starOnly=false,run=null,timer=null;
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(sets))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const getSet=()=>sets.find(s=>s.id===cur);
const side=(c,back)=>(defFirst?!back:back)?c.d:c.t;

// ---------- theme ----------
$('#themeBtn').onclick=()=>{const d=document.documentElement,on=d.getAttribute('data-theme')!=='dark';on?d.setAttribute('data-theme','dark'):d.removeAttribute('data-theme');try{localStorage.setItem('sfc-theme',on?'dark':'light')}catch(e){}};

// ---------- parsing ----------
function parse(txt,cs,rs){
  const cm={tab:'\t',comma:',',dash:' - '},rm={nl:'\n',semi:';'};
  const c=cs.v==='custom'?cs.c:cm[cs.v],r=rs.v==='custom'?rs.c:rm[rs.v];
  if(!c||!r)return[];
  return txt.split(r).map(l=>{const n=l.indexOf(c);return n<0?null:{t:l.slice(0,n).trim(),d:l.slice(n+c.length).trim(),s:false}}).filter(x=>x&&x.t&&x.d);
}
const sep=(id)=>({v:$('#'+id).value,c:($('#'+id+'c')||{}).value});

// ---------- home ----------
function home(){
  stop();mode='';cur=null;
  app.innerHTML=`<h2 class="section-title">Import from Quizlet</h2>
  <div class="card">
   <p class="muted">On Quizlet: open a set → ⋯ → <b>Export</b> → copy text → paste below. (Quizlet blocks sites from grabbing sets directly, so copy/paste is the way.) Leave the separators as they are if you used Quizlet's defaults.</p>
   <label>Quizlet link (optional)</label><div class="row"><div style="flex:3"><input type="text" id="lk" placeholder="https://quizlet.com/..."/></div><div><button class="btn alt" id="lg">Get cards from link</button></div></div><p class="muted" id="ls"></p>
   <label>Set name</label><input type="text" id="nm" placeholder="e.g. Chapter 5 Vocab"/>
   <label>Pasted cards</label><textarea id="txt" placeholder="term&#9;definition&#10;term&#9;definition"></textarea>
   <div class="row"><div><label>Between term and definition</label><select id="cs"><option value="tab">Tab</option><option value="comma">Comma</option><option value="dash">Dash ( - )</option><option value="custom">Custom</option></select><input type="text" id="csc" placeholder="custom" style="display:none;margin-top:6px"/></div>
   <div><label>Between cards</label><select id="rs"><option value="nl">New line</option><option value="semi">Semicolon</option><option value="custom">Custom</option></select><input type="text" id="rsc" placeholder="custom" style="display:none;margin-top:6px"/></div></div>
   <p class="muted" id="pv" style="margin-top:10px">0 cards found</p>
   <button class="btn" id="imp">Import Set</button>
  </div>
  <h2 class="section-title">My Sets</h2>
  <div class="grid">${sets.map(s=>`<div class="card set" onclick="openSet('${s.id}')"><h3>${esc(s.name)}</h3><p class="muted">${s.cards.length} cards</p></div>`).join('')||'<p class="muted" style="grid-column:1/-1;text-align:center">No sets yet — import one above!</p>'}</div>`;
  const upd=()=>{['cs','rs'].forEach(x=>$('#'+x+'c').style.display=$('#'+x).value==='custom'?'block':'none');$('#pv').textContent=parse($('#txt').value,sep('cs'),sep('rs')).length+' cards found'};
  ['txt','cs','rs','csc','rsc'].forEach(x=>$('#'+x).oninput=upd);upd();
  $('#imp').onclick=()=>{const c=parse($('#txt').value,sep('cs'),sep('rs'));if(!c.length)return alert('No cards found — check your separators.');sets.unshift({id:Date.now().toString(36),name:$('#nm').value.trim()||'Untitled set',cards:c});save();home()};
  $('#lg').onclick=async()=>{
    const u=$('#lk').value.trim(),st=$('#ls');
    if(!/^https?:\/\/(www\.)?quizlet\.com\//i.test(u)){st.textContent='Paste a full quizlet.com set link.';return}
    st.textContent='Fetching… (can take a few seconds)';
    const h=await getHTML(u),c=h?cardsFromHTML(h):[];
    if(!c.length){st.textContent="Couldn't pull cards from that link (Quizlet blocks most automated access). Use Export and paste instead.";return}
    $('#cs').value='tab';$('#rs').value='nl';
    $('#txt').value=c.map(x=>x.t.replace(/[\t\n]+/g,' ')+'\t'+x.d.replace(/[\t\n]+/g,' ')).join('\n');
    if(!$('#nm').value)$('#nm').value=(new DOMParser().parseFromString(h,'text/html').title||'').replace(/\s*[|-]\s*Quizlet.*$/i,'').replace(/ Flashcards$/i,'');
    upd();st.textContent='Got '+c.length+' cards. Review below, then hit Import Set.';
  };
}
async function getHTML(url){
  const ps=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
  for(const p of ps){try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000),r=await fetch(p(url),{signal:ctl.signal});clearTimeout(t);
    if(!r.ok)continue;const h=await r.text();
    if(h.length>2000&&!/Just a moment|cf-chl/i.test(h.slice(0,3000)))return h;
  }catch(e){}}
  return null;
}
function cardsFromHTML(h){
  const doc=new DOMParser().parseFromString(h,'text/html'),out=[];
  const ws=doc.querySelectorAll('.SetPageTerm-wordText'),ds=doc.querySelectorAll('.SetPageTerm-definitionText');
  ws.forEach((w,n)=>{if(ds[n])out.push({t:w.textContent.trim(),d:ds[n].textContent.trim(),s:false})});
  if(!out.length){const nd=doc.getElementById('__NEXT_DATA__');if(nd){try{(function walk(o){
    if(!o||typeof o!=='object')return;
    if(Array.isArray(o.cardSides)&&o.cardSides.length>=2){const g=x=>((x.media||[]).map(m=>m.plainText).filter(Boolean)[0])||'',t=g(o.cardSides[0]),d=g(o.cardSides[1]);if(t&&d)out.push({t,d,s:false})}
    else if(typeof o.word==='string'&&typeof o.definition==='string'&&o.word)out.push({t:o.word,d:o.definition,s:false});
    Object.values(o).forEach(walk);
  })(JSON.parse(nd.textContent))}catch(e){}}}
  const seen=new Set();
  return out.filter(c=>{const k=c.t+'\u0000'+c.d;if(!c.t||!c.d||seen.has(k))return false;seen.add(k);return true});
}
function openSet(id){cur=id;setPage()}

// ---------- set page ----------
function setPage(){
  stop();mode='';const s=getSet();if(!s)return home();
  app.innerHTML=`<div class="center"><h2 class="section-title">${esc(s.name)}</h2><p class="muted">${s.cards.length} cards · ${s.cards.filter(c=>c.s).length} starred</p>
  <div style="margin:15px 0"><button class="btn" onclick="startFC()">Flashcards</button><button class="btn" onclick="startRun('learn')">Learn</button><button class="btn" onclick="startRun('write')">Write</button><button class="btn" onclick="testSetup()">Test</button><button class="btn" onclick="startMatch()">Match</button></div>
  <div><button class="btn alt" onclick="editSet()">Edit</button><button class="btn alt" onclick="exportSet()">Export</button><button class="btn dk" onclick="delSet()">Delete</button></div></div><br/>
  <div class="card"><table>${s.cards.map((c,n)=>`<tr><td style="width:40px"><button class="star" onclick="star(${n})">${c.s?'⭐':'☆'}</button></td><td><b>${esc(c.t)}</b></td><td>${esc(c.d)}</td></tr>`).join('')}</table></div>`;
}
function star(n){const c=getSet().cards[n];c.s=!c.s;save();setPage()}
function delSet(){if(confirm('Delete this set for good?')){sets=sets.filter(s=>s.id!==cur);save();home()}}
function editSet(){const s=getSet();app.innerHTML=`<h2 class="section-title">Edit set</h2><div class="card"><label>Name</label><input type="text" id="en" value="${esc(s.name)}"/><label>Cards (term, TAB, definition — one per line)</label><textarea id="et" style="min-height:300px">${esc(s.cards.map(c=>c.t+'\t'+c.d).join('\n'))}</textarea><button class="btn" id="es">Save</button><button class="btn dk" onclick="setPage()">Cancel</button></div>`;
  $('#es').onclick=()=>{const old=Object.fromEntries(s.cards.map(c=>[c.t+'\u0000'+c.d,c.s])),n=parse($('#et').value,{v:'tab'},{v:'nl'});n.forEach(c=>c.s=!!old[c.t+'\u0000'+c.d]);if(!n.length)return alert('Need at least one card.');s.name=$('#en').value.trim()||s.name;s.cards=n;save();setPage()}}
function exportSet(){const s=getSet(),t=s.cards.map(c=>c.t+'\t'+c.d).join('\n');app.innerHTML=`<h2 class="section-title">Export</h2><div class="card"><p class="muted">Copy this to back up or share the set (tab between term and definition).</p><textarea id="ex" readonly>${esc(t)}</textarea><button class="btn" onclick="$('#ex').select();document.execCommand('copy')">Copy</button><button class="btn dk" onclick="setPage()">Back</button></div>`}
const back=`<button class="btn dk" onclick="setPage()">← Back to set</button>`;
function stop(){clearInterval(timer);timer=null;mode=''}
function pool(){const s=getSet();return s.cards}

// ---------- flashcards ----------
function startFC(){mode='fc';i=0;flipped=false;buildDeck();fc()}
function buildDeck(){const a=pool().filter(c=>!starOnly||c.s);deck=a.length?a:pool()}
function fc(){
  const c=deck[i];
  app.innerHTML=`<div class="center">${back}<p class="muted" style="margin:10px">${i+1} / ${deck.length}</p></div>
  <div class="fc ${flipped?'back':''}" onclick="flip()">${esc(side(c,flipped))}</div>
  <div class="center" style="margin-top:15px"><button class="btn" onclick="nav(-1)">◀</button><button class="btn alt" onclick="flip()">Flip</button><button class="btn" onclick="nav(1)">▶</button></div>
  <div class="center" style="margin-top:10px"><button class="cat" onclick="starCur()">${c.s?'⭐ Starred':'☆ Star'}</button><button class="cat" onclick="deck=shuf(deck);i=0;flipped=false;fc()">🔀 Shuffle</button><button class="cat ${defFirst?'on':''}" onclick="defFirst=!defFirst;flipped=false;fc()">Definition first</button><button class="cat ${starOnly?'on':''}" onclick="starOnly=!starOnly;i=0;flipped=false;buildDeck();fc()">Starred only</button></div>
  <p class="muted center" style="margin-top:10px">Keys: Space = flip, ← → = move</p>`;
}
function flip(){flipped=!flipped;fc()}
function nav(d){i=(i+d+deck.length)%deck.length;flipped=false;fc()}
function starCur(){deck[i].s=!deck[i].s;save();fc()}
document.addEventListener('keydown',e=>{if(mode!=='fc'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')nav(1);else if(e.key==='ArrowLeft')nav(-1)});

// ---------- learn / write ----------
function startRun(m){
  const cards=pool().filter(c=>!starOnly||c.s);
  mode=m;run={q:shuf(cards.length?cards:pool()),done:0,total:(cards.length?cards:pool()).length,miss:0};nextQ();
}
function nextQ(){
  if(!run.q.length){app.innerHTML=`<div class="card center"><h2>🎉 All done!</h2><p style="margin:10px">You got through ${run.total} cards with ${run.miss} miss${run.miss===1?'':'es'}.</p><button class="btn" onclick="startRun('${mode}')">Go again</button>${back}</div>`;return}
  const c=run.q[0];run.c=c;
  const head=`<div class="center">${back}</div><div class="bar"><div style="width:${run.done/run.total*100}%"></div></div><div class="card"><div class="q">${esc(side(c,false))}</div>`;
  if(mode==='learn'){
    const wrong=shuf(pool().filter(x=>x!==c&&side(x,true)!==side(c,true))).slice(0,3);
    const opts=shuf([c,...wrong]);
    app.innerHTML=head+opts.map((o,n)=>`<button class="opt" data-n="${n}">${esc(side(o,true))}</button>`).join('')+`<div id="fb"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.n]===c;document.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(opts[n]===c)x.classList.add('ok')});
      if(!ok)b.classList.add('no');answered(ok)});
  }else{
    app.innerHTML=head+`<input type="text" id="ans" placeholder="Type your answer" autocomplete="off"/><div id="fb"><button class="btn" id="chk">Check</button><button class="btn dk" id="skip">Don't know</button></div></div>`;
    $('#ans').focus();
    const chk=()=>{const ok=norm($('#ans').value)===norm(side(c,true));answered(ok,true)};
    $('#chk').onclick=chk;$('#ans').onkeydown=e=>{if(e.key==='Enter')chk()};$('#skip').onclick=()=>answered(false,true);
  }
}
function answered(ok,typed){
  const c=run.c;let h=ok?`<p class="good">✔ Correct!</p>`:`<p class="bad">✘ Answer: ${esc(side(c,true))}</p>`;
  if(typed&&!ok&&$('#ans').value.trim())h+=`<button class="btn alt" id="ovr">I was right</button>`;
  $('#fb').innerHTML=h+`<button class="btn" id="nx">Continue</button>`;
  let fin=false;const go=(good)=>{if(fin)return;fin=true;run.q.shift();if(good){run.done++}else{run.miss++;run.q.push(c)}nextQ()};
  if(typed&&$('#ans'))$('#ans').disabled=true;
  $('#nx').onclick=()=>go(ok);$('#nx').focus();
  if($('#ovr'))$('#ovr').onclick=()=>go(true);
}

// ---------- test ----------
function testSetup(){
  const n=pool().length;
  app.innerHTML=`<h2 class="section-title">Test</h2><div class="card"><label>Number of questions</label><input type="number" id="tn" min="1" max="${n}" value="${Math.min(20,n)}"/>
  <label>Question types</label><div><label style="display:inline;margin-right:14px"><input type="checkbox" class="tt" value="mc" checked/> Multiple choice</label><label style="display:inline;margin-right:14px"><input type="checkbox" class="tt" value="tf" checked/> True / False</label><label style="display:inline"><input type="checkbox" class="tt" value="w" checked/> Written</label></div>
  <label style="margin-top:12px"><input type="checkbox" id="tso"/> Starred cards only</label>
  <br/><button class="btn" id="tg">Start Test</button>${back}</div>`;
  $('#tg').onclick=()=>{
    const ty=[...document.querySelectorAll('.tt:checked')].map(x=>x.value);if(!ty.length)return alert('Pick a question type.');
    let c=pool().filter(x=>!$('#tso').checked||x.s);if(!c.length)c=pool();
    c=shuf(c).slice(0,Math.max(1,Math.min(+$('#tn').value||1,c.length)));
    run={qs:c.map((card,n)=>{const t=ty[n%ty.length];const o={card,t};
      if(t==='mc'){const w=shuf(pool().filter(x=>x!==card&&x.d!==card.d)).slice(0,3);o.opts=shuf([card,...w])}
      if(t==='tf'){const other=shuf(pool().filter(x=>x!==card&&x.d!==card.d))[0];o.shown=(Math.random()<.5||!other)?card:other}
      return o})};
    run.qs=shuf(run.qs);renderTest();
  };
}
function renderTest(){
  app.innerHTML=`<div class="center">${back}</div><br/>`+run.qs.map((q,n)=>{
    const c=q.card;let b=`<div class="card"><p class="muted">Question ${n+1}</p><div class="q">${esc(side(c,false))}</div>`;
    if(q.t==='mc')b+=q.opts.map((o,k)=>`<label style="font-weight:normal;margin:6px 0"><input type="radio" name="q${n}" value="${k}"/> ${esc(side(o,true))}</label>`).join('');
    if(q.t==='tf')b+=`<p>Is this the right match?<br/><b>${esc(side(q.shown,true))}</b></p><label style="display:inline;margin-right:14px"><input type="radio" name="q${n}" value="1"/> True</label><label style="display:inline"><input type="radio" name="q${n}" value="0"/> False</label>`;
    if(q.t==='w')b+=`<input type="text" id="w${n}" placeholder="Type your answer" autocomplete="off"/>`;
    return b+`<div id="r${n}"></div></div>`}).join('')+`<div class="center"><button class="btn" id="sub">Submit Test</button></div>`;
  $('#sub').onclick=gradeTest;
}
function gradeTest(){
  let score=0;
  run.qs.forEach((q,n)=>{
    const c=q.card;let ok=false,mine='';
    if(q.t==='mc'){const v=document.querySelector(`input[name=q${n}]:checked`);mine=v?side(q.opts[+v.value],true):'(blank)';ok=!!v&&q.opts[+v.value]===c}
    if(q.t==='tf'){const v=document.querySelector(`input[name=q${n}]:checked`);mine=v?(v.value==='1'?'True':'False'):'(blank)';ok=!!v&&((v.value==='1')===(q.shown===c))}
    if(q.t==='w'){mine=$('#w'+n).value;ok=norm(mine)===norm(side(c,true))}
    if(ok)score++;
    $('#r'+n).innerHTML=ok?`<p class="good">✔ Correct</p>`:`<p class="bad">✘ You said: ${esc(mine||'(blank)')}</p><p class="good">Correct: ${q.t==='tf'?(q.shown===c?'True':'False — it was '+esc(side(c,true))):esc(side(c,true))}</p>`;
  });
  $('#sub').outerHTML=`<h2 class="center">Score: ${score} / ${run.qs.length} (${Math.round(score/run.qs.length*100)}%)</h2><div class="center"><button class="btn" onclick="testSetup()">New test</button></div>`;
  scrollTo({top:0,behavior:'smooth'});
}

// ---------- match ----------
function startMatch(){
  stop();const c=shuf(pool()).slice(0,6);
  let tiles=shuf(c.flatMap((x,n)=>[{k:n,v:x.t},{k:n,v:x.d}])),sel=null,left=c.length,t0=Date.now(),busy=false;
  app.innerHTML=`<div class="center">${back}<h2 class="section-title">Match</h2><p class="muted">Click a term, then its definition. Time: <b id="tm">0.0</b>s</p></div><div class="mg" id="mg">${tiles.map((x,n)=>`<div class="tile" data-n="${n}">${esc(x.v)}</div>`).join('')}</div>`;
  mode='match';timer=setInterval(()=>{$('#tm').textContent=((Date.now()-t0)/1000).toFixed(1)},100);
  document.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
    if(busy||el.classList.contains('gone')||el===sel)return;
    if(!sel){sel=el;el.classList.add('sel');return}
    const a=tiles[+sel.dataset.n],b=tiles[+el.dataset.n];
    if(a.k===b.k&&a.v!==b.v||a.k===b.k){sel.classList.add('gone');el.classList.add('gone');sel=null;
      if(--left===0){clearInterval(timer);const t=((Date.now()-t0)/1000).toFixed(1);$('#mg').insertAdjacentHTML('beforebegin',`<h2 class="center good">🎉 Done in ${t}s!</h2><div class="center"><button class="btn" onclick="startMatch()">Play again</button></div>`)}}
    else{busy=true;const s=sel;el.classList.add('wrong');s.classList.add('wrong');setTimeout(()=>{el.classList.remove('wrong');s.classList.remove('wrong','sel');sel=null;busy=false},500);t0-=1000}
  });
}
home();
</script>
